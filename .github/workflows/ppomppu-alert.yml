name: 뽐뿌 키워드 알림

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트만 하기 (카톡 안 보내고 읽은 글만 로그에 표시)'
        type: boolean
        default: true

concurrency:
  group: ppomppu-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 새 글 확인 및 카톡 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          LAST_SEEN_NO: ${{ vars.LAST_SEEN_NO }}
          DAILY: ${{ github.event.schedule == '17 3 * * *' && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 ppomppu_alert.py run

      - name: 저장소 활동 유지
        if: github.event.schedule == '17 3 * * *'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
